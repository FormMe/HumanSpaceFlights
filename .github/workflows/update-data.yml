name: Update spaceflight data

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday, 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "data/source/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

# Runs wait for each other instead of cancelling: a cancelled run would throw
# away a fetch that took half an hour.
concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch raw data (Wikidata + Wikipedia)
        timeout-minutes: 45
        run: python scripts/fetch_data.py

      - name: Build CSV files for the app
        run: python scripts/build_data.py

      # Photos are a nice-to-have: when Wikimedia is slow or down, the new
      # CSV files are still committed (the packs keep the old images).
      - name: Download photos and mission patches
        timeout-minutes: 30
        continue-on-error: true
        run: python scripts/fetch_photos.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data
          # a run that changed nothing but the time stamps in the two meta.json
          # files is not worth a commit
          real=$(git diff --cached --name-only | grep -v -x -e data/meta.json -e data/raw/meta.json || true)
          for f in data/meta.json data/raw/meta.json; do
            if ! git diff --cached --quiet -- "$f" && \
               git diff --cached -U0 -- "$f" | grep -E '^[-+] ' | grep -v -E '"(built_at|fetched_at)"' | grep -q .; then
              real="$real $f"
            fi
          done
          if [ -z "$(echo $real)" ]; then
            echo "No data changes"
          else
            git commit -m "Update spaceflight data ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
